[project]
name = "mise"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.136.0",
    "uvicorn[standard]==0.44.0",
    "pydantic==2.13.3",
    "pydantic-settings>=2.6",
    "playwright==1.58.0",
    "tf-playwright-stealth==1.2.0",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "aiokafka==0.13.0",
    "redis==7.4.0",
    "sqlalchemy[asyncio]==2.0.49",
    "asyncpg==0.31.0",
    "psycopg[binary]==3.3.3",
    "alembic==1.18.4",
    "resend==2.29.0",
    "twilio==9.10.5",
    "pywebpush==2.3.0",
    "cryptography>=43",
    "prometheus-client==0.25.0",
    "prometheus-fastapi-instrumentator==7.1.0",
    "structlog==25.5.0",
    "orjson==3.11.8",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-httpx>=0.35",
    "testcontainers[kafka,redis,postgres]>=4.8",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "services"]
