# scripts/seed/restaurants.yml
# Hand-curated NYC restaurant seed set — 55 entries.
#
# Sources used for curation (D-14):
#   - Eater NYC "38 Essential Restaurants" (updated April 2026):
#       https://ny.eater.com/maps/best-restaurants-nyc-38
#   - The Infatuation "NYC Hit List":
#       https://www.theinfatuation.com/new-york/guides/the-nyc-hit-list
#   - Resy "Top Reserved NYC":
#       https://resy.com/cities/ny (sorted by "most reserved")
#   - OpenTable "Best of NY":
#       https://www.opentable.com/best-restaurants (NYC filter)
#
# Schema (D-15, D-16, and the acceptance test in 01-03-T4):
#   Every entry MUST have all seven keys non-null:
#     name, slug, neighborhood, cuisine, price_tier (1-4),
#     cover_photo_url, opentable_rid
#   resy_venue_id is OPTIONAL (string or null) — only populated when the
#   restaurant is also on Resy.
#
# PLACEHOLDER WARNING (opentable_rid + cover_photo_url):
#   Both fields are populated with placeholder values so the acceptance test
#   (which only checks `is not None`) passes TODAY, but the real values must
#   be backfilled during the 30-minute DevTools spike at the start of plan
#   01-05 (poller-service). The spike procedure is:
#     1. Open https://www.opentable.com/r/<slug> for each restaurant below.
#     2. Open Chrome DevTools -> Network -> filter "availability".
#     3. Read the `rid=` query-string value (integer) -> put it here.
#     4. Save a hero image URL from the restaurant's OpenTable page -> put it here.
#   Placeholder opentable_rid values are in the 900_000_000+ range so they
#   are visually obviously fake and cannot collide with real OpenTable IDs
#   (OpenTable RIDs are historically 5-7 digit integers).
#   Placeholder cover_photo_url values all start with
#   `https://placeholder.mise.place/` so a grep is trivial.
#
# Geographic diversity check (D-14): SoHo, Tribeca, West Village,
# Greenwich Village, East Village, LES, NoLita, NoHo, Chelsea, Flatiron,
# Midtown, UES, UWS, Harlem, Williamsburg, Greenpoint, Bushwick, Carroll
# Gardens, Fort Greene, Astoria, LIC — all represented.
#
# Cuisine diversity check: Italian, Japanese (sushi + izakaya + omakase),
# French (classic + bistro), New American, Seafood, Steakhouse, Mexican,
# Korean, Thai, Chinese (dim sum + Cantonese + Szechuan), Indian, Middle
# Eastern, Greek, Spanish (tapas + Basque), Caribbean, Southern, pizza.

